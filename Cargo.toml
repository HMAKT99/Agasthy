[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/platform-adapters",
  "crates/provenance",
  "crates/system-monitor",
  "crates/discovery",
  "crates/graph",
  "crates/process-manager",
  "crates/cleanup",
  "crates/actions",
  "crates/snapshots",
  "crates/security",
  "crates/update-lab",
  "crates/ai-engine",
  "crates/cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.10"
edition = "2024"
license = "Apache-2.0"
authors = ["The AGASTHY Authors"]
# Distributed as an app, not published to crates.io.
publish = false
rust-version = "1.90"

[workspace.dependencies]
agasthy-core = { path = "crates/core" }
agasthy-platform = { path = "crates/platform-adapters" }
agasthy-provenance = { path = "crates/provenance" }
agasthy-discovery = { path = "crates/discovery" }
agasthy-system-monitor = { path = "crates/system-monitor" }
agasthy-graph = { path = "crates/graph" }
agasthy-process = { path = "crates/process-manager" }
agasthy-cleanup = { path = "crates/cleanup" }
agasthy-actions = { path = "crates/actions" }
agasthy-snapshots = { path = "crates/snapshots" }
agasthy-security = { path = "crates/security" }
agasthy-update-lab = { path = "crates/update-lab" }
agasthy-ai = { path = "crates/ai-engine" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
ts-rs = "12"
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk", "component"] }
walkdir = "2.5"
toml = "1.2"
tempfile = "3"
dirs = "7"
plist = "1.10"
wait-timeout = "0.2"
sha2 = "0.10"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Disk on the development host is tight: keep debug builds small.
[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
