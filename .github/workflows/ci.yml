name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential
      - name: Frontend dist placeholder for tauri::generate_context!
        shell: bash
        run: mkdir -p apps/desktop/dist && touch apps/desktop/dist/index.html
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  arch-pacman:
    # The pacman parser against a real Arch Linux package database (the
    # system Omarchy and Manjaro are built on), not only recorded samples.
    name: Arch Linux (pacman)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git gcc rustup
      - uses: actions/checkout@v4
      - name: Rust (the toolchain pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Parse this system's pacman database
        run: cargo test -p agasthy-discovery --lib pacman_on_arch -- --ignored --nocapture

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent plugin carries the same skill as skills/agasthy
        run: |
          cmp skills/agasthy/SKILL.md plugins/agasthy/skills/agasthy/SKILL.md
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          for f in plugins/agasthy/plugin.json plugins/agasthy/.claude-plugin/plugin.json plugins/agasthy/.codex-plugin/plugin.json integrations/mcp/mcpb/manifest.json gemini-extension.json; do
            test "$(node -p "require('./$f').version")" = "$v" || { echo "$f version != $v"; exit 1; }
          done
          grep -q "^version: $v$" skills/agasthy/SKILL.md || { echo "SKILL.md version != $v"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Playwright browsers
        run: pnpm --filter @agasthy/desktop exec playwright install --with-deps chromium
      - run: pnpm e2e

  generated-types:
    name: Generated TypeScript types are current
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p apps/desktop/dist && touch apps/desktop/dist/index.html
      - run: node scripts/gen-types.mjs --check

  bundle-macos:
    name: macOS app bundle
    runs-on: macos-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Inside the repo, so the targets go to the toolchain rust-toolchain.toml pins
      # (the action's `targets:` would add them to "stable" instead).
      - name: Rust targets for a universal macOS build
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin && rustup target list --installed
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned universal bundle (Apple silicon and Intel), as releases do
        # Updater artifacts need the release signing key, which only the Release workflow has.
        run: pnpm --filter @agasthy/desktop tauri build --target universal-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Both architectures are in the app and it starts on each
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/AGASTHY.app
          lipo -archs "$app/Contents/MacOS/agasthy-desktop" | tee /dev/stderr | grep -q "x86_64" 
          lipo -archs "$app/Contents/MacOS/agasthy-desktop" | grep -q "arm64"
      - name: Universal command-line tool runs on both architectures
        run: |
          cargo build --release -p agasthy-cli --target aarch64-apple-darwin
          cargo build --release -p agasthy-cli --target x86_64-apple-darwin
          lipo -create -output agasthy target/aarch64-apple-darwin/release/agasthy target/x86_64-apple-darwin/release/agasthy
          ./agasthy --version
          if arch -x86_64 /usr/bin/true 2>/dev/null; then arch -x86_64 ./agasthy --version; else echo "Rosetta not available on this runner; skipped the Intel run"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: AGASTHY-macos-universal-unsigned
          path: target/universal-apple-darwin/release/bundle/macos/AGASTHY.app
          retention-days: 7
