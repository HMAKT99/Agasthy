name: README download links

# When a release is published (not when the draft is created, because draft
# links 404), point the README's versioned download links (the app downloads
# for each OS and the Claude Desktop .mcpb) at it and commit to main. Run it by hand
# with a tag to redo it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, e.g. v0.1.6"
        required: true

permissions:
  contents: write

concurrency:
  group: readme-links
  cancel-in-progress: false

jobs:
  update:
    name: Update README links
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point links at the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: bash scripts/readme-release-links.sh "$TAG"
      - name: Commit if anything changed
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if git diff --quiet README.md README.zh-CN.md; then echo "README links already point at $TAG"; exit 0; fi
          git diff README.md README.zh-CN.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "README: download links for $TAG" README.md README.zh-CN.md
          git pull --rebase origin main
          git push origin HEAD:main
