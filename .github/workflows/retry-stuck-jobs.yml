name: Retry stuck CI jobs

# GitHub's macOS runners sometimes leave a job waiting until it is cancelled
# about 15 minutes later, before it has run a single step. The job is a
# required check, so that blocks merging until someone re-runs it. This
# re-runs such a CI run once, automatically.
#
# It acts only when all of these hold:
#   - the run's first attempt finished as failed or cancelled;
#   - at least one job was cancelled without running any step;
#   - no job actually failed (a real failure is never retried);
#   - the run is still the newest CI run for its branch (a run cancelled
#     because a newer push replaced it is left alone).
# No code is checked out; it only reads job results and asks for a re-run.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Re-run if a job was stuck, not failed
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100")
          failed=$(jq '[.jobs[] | select(.conclusion == "failure")] | length' <<<"$jobs")
          stuck=$(jq '[.jobs[] | select(.conclusion == "cancelled" and ([.steps[]? | select(.conclusion != null and .conclusion != "skipped")] | length) == 0)] | length' <<<"$jobs")
          latest=$(gh run list --workflow CI --branch "$BRANCH" --limit 1 --json databaseId -q '.[0].databaseId')
          echo "failed=$failed stuck=$stuck latest=$latest run=$RUN_ID"
          if [ "$failed" != "0" ]; then echo "A job really failed: not retrying."; exit 0; fi
          if [ "$stuck" = "0" ]; then echo "No job was stuck: not retrying."; exit 0; fi
          if [ "$latest" != "$RUN_ID" ]; then echo "A newer run replaced this one: not retrying."; exit 0; fi
          gh run rerun "$RUN_ID" --failed
          echo "Re-ran the stuck job(s) of run $RUN_ID."
